name: Release

on:
  pull_request:
    branches: [main]
  push:
    tags: ['release-v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neguse/lub
          ref: 362510eb1f596f69d983501d930e4dfbb57581c3
          submodules: recursive
          path: .cache/lub
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.111
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 ffmpeg unzip libvulkan-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libudev-dev
      - name: Download original assets
        run: |
          mkdir -p .cache/originals
          cd .cache/originals
          curl -fL --retry 3 https://abagames.sakura.ne.jp/xna/gtg/GearToyGear0_1.zip -o GearToyGear0_1.zip
          curl -fL --retry 3 https://abagames.sakura.ne.jp/windows/tt0_22.zip -o tt0_22.zip
          curl -fL --retry 3 https://abagames.sakura.ne.jp/xna/mm/Mm0_14.zip -o Mm0_14.zip
          sha256sum --check <<'EOF'
          b068c6b1dd5a7bfcc65830ba6fe946dbc6182ac720c58d6b3518546b5f22f04a  GearToyGear0_1.zip
          6fcbb3de9ac5cfce38253f71257143631a978c625b041c8527d18ddb5c8813fa  tt0_22.zip
          286e6081a0d887c1f75069298174ab9bb43d43daa8d0f5288a744d9f9d58d533  Mm0_14.zip
          EOF
          unzip -q GearToyGear0_1.zip
          unzip -q tt0_22.zip
          unzip -q Mm0_14.zip
      - name: Build pinned Lub and tcs
        working-directory: .cache/lub
        run: |
          python3 ../../tools/apply_collection_lub.py .
          test "$(git -C third_party/tcs rev-parse HEAD)" = 8b1e4ba35d4987896e2ea2a8d356ed86059fca68
          dotnet build third_party/tcs/Transpiler/Transpiler.csproj -c Release
          timeout 7200 bash scripts/build-release.sh --target lub
          timeout 7200 bash scripts/build-release.sh --target lub_shared --no-configure
      - name: Build games
        run: |
          mkdir -p build/frame/native
          cp -L .cache/lub/build-release-linux/lub build/frame/native/
          cp -L .cache/lub/build-release-linux/liblub.so build/frame/native/
          cp -L .cache/lub/build-release-linux/third_party/SDL/libSDL3.so.0 build/frame/native/
          cp -L .cache/lub/build-release-linux/third_party/openxr/src/loader/libopenxr_loader.so.1 build/frame/native/
          cp -L .cache/lub/third_party/slang/lib/libslang-compiler.so.0.2026.8.1 build/frame/native/
          python3 tools/build_gtg_frame.py --lub .cache/lub \
            --original .cache/originals/GearToyGear/GearToyGear --native build/frame/native
          mv build/frame/publish build/frame/GearToyGear
          python3 tools/build_tt_frame.py --lub .cache/lub \
            --original .cache/originals/tt --native build/frame/native \
            --runtime both --tcs .cache/lub/third_party/tcs
          mv build/frame/publish build/frame/TorusTrooper
          python3 tools/build_mm_frame.py --lub .cache/lub \
            --original .cache/originals/Mm/Mm --native build/frame/native
          mv build/mm-frame/publish build/frame/MazerMayhem
      - name: Package and inspect ZIPs
        run: |
          python3 -m unittest discover -s tests -p test_frame_installer.py
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import re
          import stat
          from zipfile import ZipFile, ZIP_DEFLATED

          root = Path('build/frame')
          native = {'lub', 'liblub.so', 'libSDL3.so.0', 'libopenxr_loader.so.1',
                    'libslang-compiler.so.0.2026.8.1', 'LICENSE-lub.txt', 'LICENSE-SDL.txt',
                    'LICENSE-OpenXR.txt', 'LICENSE-Slang.txt', 'THIRD_PARTY_NOTICES.txt'}
          licenses = {'LICENSE.txt', 'DOTNET-LICENSE.TXT', 'DOTNET-THIRD-PARTY-NOTICES.TXT'}
          patterns = {
              'private key': rb'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----',
              'access token': rb'(?<![A-Za-z0-9_])(?:gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{40,}|AKIA[A-Z0-9]{16}|xox[baprs]-[0-9A-Za-z-]{15,})',
              'personal home path': rb'(?:/home/(?!runner/)[^/\s\x00]+/|/Users/[^/\s\x00]+/|[A-Za-z]:\\Users\\[^\\\s\x00]+\\)',
              'local network address': rb'(?<![0-9.])192\.168\.[0-9]{1,3}\.[0-9]{1,3}(?![0-9.])',
          }
          for game in ('GearToyGear', 'TorusTrooper', 'MazerMayhem'):
              directory = root / game
              required = licenses | {game, game + '.dll', 'Lub.dll', 'TinySystem.dll',
                                     game + '.deps.json', game + '.runtimeconfig.json', 'run.sh',
                                     'game.lua', 'samples/boot.lua', 'third_party/lume/lume.lua'}
              if game == 'TorusTrooper':
                  required |= {'TorusTrooper-c', 'LICENSE-tcs.txt', 'images/title-torus-trooper.png'}
              required |= {'native/' + name for name in native}
              required |= {'game.vs.slang', 'game.fs.slang', 'scene.output.slang'} if game != 'TorusTrooper' else {'mesh.vs.slang', 'mesh.fs.slang', 'mesh.output.slang', 'README-original.txt'}
              files = {p.relative_to(directory).as_posix(): p for p in directory.rglob('*') if p.is_file()}
              if not required <= files.keys() or not any(n.startswith('audio/') for n in files):
                  raise SystemExit(f'{game}: missing required files')
              for name, path in files.items():
                  permitted = name in required or (
                      '/' not in name and (path.suffix in {'.dll', '.pdb', '.so'} or name == 'createdump')
                  ) or (path.parent == directory / 'audio' and path.suffix == '.wav')
                  if not permitted or path.is_symlink() or path.stat().st_size == 0:
                      raise SystemExit(f'{game}: unexpected or empty file: {name}')
                  data = path.read_bytes()
                  if data.startswith(b'\x7fELF') and int.from_bytes(data[18:20], 'little') != 183:
                      raise SystemExit(f'{game}: non-ARM64 ELF: {name}')
                  if name in {'run.sh', game, 'TorusTrooper-c', 'native/lub'} and not path.stat().st_mode & stat.S_IXUSR:
                      raise SystemExit(f'{game}: missing executable permission: {name}')
                  views = [data, b'\n'.join(s[::2] for s in re.findall(rb'(?:[ -~]\x00){5,}', data))]
                  for label, pattern in patterns.items():
                      if any(re.search(pattern, view) for view in views):
                          raise SystemExit(f'{game}: {label} detected in {name}')
              archive = root / (game + '-steam-frame-arm64.zip')
              with ZipFile(archive, 'w', ZIP_DEFLATED) as z:
                  for name, path in sorted(files.items()):
                      z.write(path, game + '/' + name)
              with ZipFile(archive) as z:
                  if z.testzip() is not None or len(z.namelist()) != len(files):
                      raise SystemExit(f'{game}: ZIP integrity check failed')
                  for name in ('run.sh', game, 'native/lub'):
                      if not (z.getinfo(game + '/' + name).external_attr >> 16) & stat.S_IXUSR:
                          raise SystemExit(f'{game}: ZIP lost executable permission')
              print(hashlib.sha256(archive.read_bytes()).hexdigest(), archive.name)
          PY
          cp Install-ABA-Games.desktop tools/install_frame.py build/frame/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: steam-frame-zips
          path: |
            build/frame/*-steam-frame-arm64.zip
            build/frame/Install-ABA-Games.desktop
            build/frame/install_frame.py
          compression-level: 0
          if-no-files-found: error

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the explicitly authorized PR48 preview tied to its exact head.
          ref: ${{ github.event.pull_request.number == 48 && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.111
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 ffmpeg unzip
          git clone --depth 1 --branch 5.0.2 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 5.0.2
          "$HOME/emsdk/emsdk" activate 5.0.2
      - name: Build web games
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          bash tools/setup_lub.sh
          timeout 5400 python3 tools/build.py --lub .cache/lub --tcs .cache/lub/third_party/tcs --emsdk "$HOME/emsdk"
      - name: Verify game logic and barrage patterns
        run: |
          python3 tests/check_patterns.py
          python3 tests/check_patterns.py --patterns .cache/original/p47 --expected-cases 425
          python3 tests/check_patterns.py --patterns .cache/original/tt/barrage --expected-cases 140
          python3 tests/check_patterns.py --patterns .cache/original/rr --expected-cases 340
          python3 tests/check_patterns.py --patterns .cache/original/noiz2sa --expected-cases 365
          for game in tumiki parsec47 gunroar titanion a7xpg torus-trooper rrootage noiz2sa wok mazer-mayhem gear-toy-gear mu-cade; do
            python3 tests/check_game.py --lub .cache/lub --game "$game"
          done
          node tests/audio.test.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: web-dist
          path: dist
          if-no-files-found: error

  web-preview:
    # Public preview authorization is deliberately limited to this same-repo PR.
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.number == 48 &&
      github.repository == 'neguse/aba-games-unofficial-ports' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/thirteen-game-collection'
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.web.outputs.artifact-id }}
          merge-multiple: true
          path: dist
      - name: Test preview verification
        run: python3 -m unittest discover -s tests -p test_pr_preview_verification.py
      - name: Upload PR48 and verify authenticated version provenance
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WEB_ARTIFACT_ID: ${{ needs.web.outputs.artifact-id }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request
          from tools.pr_preview_verification import check_public_preview, dist_manifest, preview_identity, verify_version

          for name in ('CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID'):
              if not os.environ.get(name):
                  raise SystemExit(f'Missing existing repository secret: {name}')
          config = json.loads(Path('wrangler.jsonc').read_text())
          expected = {
              'name': 'aba-games-unofficial-ports', 'compatibility_date': '2026-09-22',
              'workers_dev': True, 'preview_urls': True, 'assets': {'directory': './dist'},
          }
          if config != expected:
              raise SystemExit('Preview is limited to the existing static-assets-only Worker configuration')
          head = os.environ['PREVIEW_HEAD_SHA']
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != head:
              raise SystemExit('Preview checkout does not match the PR head')
          base = 'https://api.cloudflare.com/client/v4/accounts/' + os.environ['CLOUDFLARE_ACCOUNT_ID']
          base += '/workers/scripts/aba-games-unofficial-ports'

          def cloudflare_get(path):
              request = urllib.request.Request(base + path, headers={
                  'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN'],
              })
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
              if not result.get('success'):
                  raise SystemExit('Cloudflare read failed: ' + path)
              return result['result']

          if not cloudflare_get('/subdomain').get('previews_enabled'):
              raise SystemExit('Existing Worker preview URLs are disabled; no settings were changed')
          deployments_before = cloudflare_get('/deployments')
          provenance = {
              'pull_request': 48, 'head_sha': head, 'artifact_id': os.environ['WEB_ARTIFACT_ID'],
              'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          Path('dist/pr-preview.json').write_text(json.dumps(provenance) + '\n')
          # Bind this upload to the exact downloaded artifact and its file manifest.
          # This is control-plane provenance, not remote asset byte readback.
          manifest_bytes = dist_manifest('dist')
          tree_digest = hashlib.sha256(manifest_bytes).hexdigest()
          message = (
              f"PR48 sha={head} artifact={provenance['artifact_id']} "
              f"run={os.environ['GITHUB_RUN_ID']}.{os.environ['GITHUB_RUN_ATTEMPT']} "
              f"tree-sha256={tree_digest}"
          )
          if len(message.encode('utf-8')) > 1000:
              raise SystemExit('Cloudflare version message would be truncated')
          Path('preview-evidence').mkdir(exist_ok=True)
          Path('preview-evidence/manifest.json').write_bytes(manifest_bytes + b'\n')
          receipt_path = Path('preview-evidence/wrangler-output.jsonl').resolve()
          if receipt_path.exists():
              raise SystemExit('Wrangler output receipt must be fresh')
          upload_env = {**os.environ, 'WRANGLER_OUTPUT_FILE_PATH': str(receipt_path)}
          # Upload only: never deploy/promote a version or apply trigger/settings changes.
          result = subprocess.run([
              'npx', '--yes', 'wrangler@4.146.0', 'versions', 'upload',
              '--preview-alias', 'pr-48', '--tag', 'pr-48', '--message', message,
          ], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, env=upload_env)
          print(result.stdout, flush=True)
          result.check_returncode()
          if cloudflare_get('/deployments') != deployments_before:
              raise SystemExit('Production deployment state changed during preview upload; inspect before proceeding')
          if dist_manifest('dist') != manifest_bytes:
              raise SystemExit('Preview assets changed during upload')
          version_id, url = preview_identity(receipt_path.read_text())
          verify_version(cloudflare_get('/versions/' + version_id), version_id, message)
          evidence = {
              **provenance, 'version_id': version_id, 'preview_url': url,
              'tree_sha256': tree_digest, 'version_message': message,
              'provider_provenance': 'passed', 'production_unchanged': True,
              'public_probe': {'status': 'not_run'},
          }
          try:
              evidence['public_probe'] = check_public_preview(url, provenance)
          except Exception as error:
              evidence['public_probe'] = {'status': 'failed', 'error_type': type(error).__name__}
              raise
          finally:
              Path('preview-evidence/verification.json').write_text(json.dumps(evidence, indent=2) + '\n')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(
                      f"PR48 preview: {url}\n\nHead: `{head}`\n\n"
                      f"Web artifact: `{provenance['artifact_id']}`\n\n"
                      f"Cloudflare version: `{version_id}`\n\n"
                      "Authenticated upload provenance: **passed**. Production deployment unchanged.\n\n"
                      f"Public HTTP verification: **{evidence['public_probe']['status']}**.\n"
                  )
                  if evidence['public_probe']['status'] == 'blocked':
                      summary.write(
                          "HTTP 403 / Cloudflare 1010 refused the CI client. Public provenance and "
                          "availability are NOT verified; browser review is required. "
                          "No security settings were changed.\n"
                      )
          if evidence['public_probe']['status'] == 'blocked':
              print('::warning::Public preview verification BLOCKED by HTTP403/Cloudflare1010; '
                    'upload provenance passed, public access requires browser review')
          print('Verified authenticated PR48 upload provenance:', version_id)
          PYTHON
      - name: Preserve preview verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr48-preview-verification
          path: |
            preview-evidence/manifest.json
            preview-evidence/verification.json
          if-no-files-found: warn

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release-v')
    needs: [build, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.web.outputs.artifact-id }}
          merge-multiple: true
          path: dist
      - name: Publish the release and the web build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > notes.md <<EOF
          Steam Frame 本体で動作する GearToyGear / Torus Trooper / Mazer Mayhem。

          [Click to Install](https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}/Install-ABA-Games.desktop) をSteam Frameでダウンロードし、開いて実行してください。3ゲームをまとめて導入・更新します。
          [操作・ビルド手順と依存バージョン](https://github.com/${GH_REPO}/blob/${RELEASE_TAG}/README.md)
          EOF
          # A tag with "-rc" is a release candidate: a prerelease on GitHub and an undeployed preview version on the web.
          candidate=false
          case "$RELEASE_TAG" in *-rc*) candidate=true ;; esac
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease="$candidate" \
            --title "$RELEASE_TAG" --notes-file notes.md \
            assets/GearToyGear-steam-frame-arm64.zip assets/TorusTrooper-steam-frame-arm64.zip assets/MazerMayhem-steam-frame-arm64.zip \
            assets/Install-ABA-Games.desktop assets/install_frame.py
          if "$candidate"; then
            npx --yes wrangler@4.146.0 versions upload --tag "$RELEASE_TAG" --message "$RELEASE_TAG"
            # versions upload leaves workers_dev and preview_urls unapplied; the preview URL needs them.
            npx --yes wrangler@4.146.0 triggers deploy
          else
            npx --yes wrangler@4.146.0 deploy
          fi
          gh release edit "$RELEASE_TAG" --draft=false
