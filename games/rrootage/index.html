  <canvas id="canvas" width="640" height="480" tabindex="0" aria-label="rRootage ゲーム画面"></canvas>
  <p id="status" role="status">読み込み中…</p>
  <p>開始・レーザー：Z / Ctrl　移動：矢印 / WASD　特殊操作：X / Shift　ポーズ：P　タイトルへ：Esc</p>
  <p>タイトルで矢印：ステージ選択、X：モード変更。各モード40ステージ、5体のボスを倒すとクリア。<br>特殊操作はNORMAL：ボム、PSY：回転してかすり範囲を拡大、IKA：白赤の属性切替、GW：押し続けて反射バリア。</p>
