<!doctype html>
<html lang="ja">
<meta charset="utf-8">

<title>GearToyGear</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../style.css">
<main>
  <canvas id="canvas" width="640" height="480" tabindex="0" aria-label="GearToyGear ゲーム画面"></canvas>
  <p id="status" role="status">読み込み中…</p>
  <p><button id="vr" type="button" hidden disabled>VRを確認中…</button></p>
  <p>VR：左スティックで移動、右トリガーで加速、左トリガーで減速、Aで開始、Xでポーズ、Bでタイトルへ（ポーズ中）。</p>
  <p>移動：矢印 / WASD　開始・加速：X / V / , / /　減速：Z / C / M / .　アクセル：E　ブレーキ：Q　ポーズ：F1 / P　タイトルへ：Esc</p>
  <p>ショットと誘導レーザーは自動で発射します。敵と障害物を避けながら加速すると、ゲーム速度と得点倍率が上がります。</p>
  <nav><button id="sound" type="button" aria-pressed="false">音：オン</button><button id="fullscreen" type="button">全画面</button><a href="https://www.asahi-net.or.jp/~cs8k-cyu/xna/gtg/index_e.html">原作：Kenta Cho / ABA Games</a><a href="LICENSE.txt">ライセンス</a><a href="../tumiki.html">TUMIKI Fighters</a></nav>
</main>
<script id="game-config" type="application/json">{"webxr": true, "wasm": "wasm/"}</script>
<script type="module" src="../main.js"></script>
</html>
