  <p id="status" role="status">読み込み中…</p>
  <p>競技の選択、ポーズ、ランキングは画面の中のメニュー（F4）から。F2で5種競技、F5〜F9で各競技、F3でポーズ、F10で記録。</p>
  <p>マウスをぐりぐり動かして力をため、クリックでアクション。Spaceはクリック、Shiftを押すたびにマウス移動を補えます。Escでポーズします。</p>
