<title>Noiz2sa</title>

<main>
  <canvas id="canvas" width="640" height="480" tabindex="0" aria-label="Noiz2sa ゲーム画面"></canvas>
  <p id="status" role="status">読み込み中…</p>
  <p>開始・ショット：Z / Ctrl　移動：矢印 / WASD　低速移動：X / Shift　ポーズ：P　タイトルへ：Esc</p>
  <p>タイトルで矢印：ステージ選択。通常10ステージと4種類のエンドレスがあります。<br>緑の星を続けて取ると得点が増えます。敵本体に触れてもミスにはなりません。</p>
  <nav><button id="sound" type="button" aria-pressed="false">音：オン</button><button id="fullscreen" type="button">全画面</button><a href="https://www.asahi-net.or.jp/~cs8k-cyu/windows/noiz2sa_e.html">原作：Kenta Cho / ABA Games</a><a href="LICENSE.txt">ライセンス</a><a href="../">TUMIKI Fighters</a></nav>
</main>
<script id="game-config" type="application/json">{"wasm": "wasm/", "scores": "noiz2sa-scores-v1", "seed": true, "music": ["stg0", "stg1", "stg2", "stg3", "stg4", "stg5", "stg00"], "sounds": ["shot", "hit", "foedst", "bossdst", "shipdst", "bonus", "extend"], "channels": [0, 1, 2, 3, 4, 5, 6], "controls": [["ArrowUp", 1], ["Numpad8", 1], ["ArrowDown", 2], ["Numpad2", 2], ["ArrowLeft", 4], ["Numpad4", 4], ["ArrowRight", 8], ["Numpad6", 8], ["KeyZ", 16], ["Period", 16], ["ControlLeft", 16], ["ControlRight", 16], ["KeyX", 32], ["Slash", 32], ["AltLeft", 32], ["AltRight", 32], ["ShiftLeft", 32], ["ShiftRight", 32], ["KeyP", 64], ["Escape", 128], ["KeyW", 1], ["KeyS", 2], ["KeyA", 4], ["KeyD", 8], ["Numpad7", 5], ["Numpad9", 9], ["Numpad1", 6], ["Numpad3", 10]]}</script>
<script type="module">
import '../main.js';
const onMessage = lubHost.onMessage;
lubHost.onMessage = (topic, bytes) => {
  if (topic === 'quit') location.href = '../';
  else onMessage(topic, bytes);
};
</script>
</html>
