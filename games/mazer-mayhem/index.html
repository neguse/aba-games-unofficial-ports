<main>
  <canvas id="canvas" width="640" height="480" tabindex="0" aria-label="Mazer Mayhem ゲーム画面"></canvas>
  <p id="status" role="status">読み込み中…</p>
  <p><button id="vr" type="button" hidden disabled>VRを確認中…</button></p>
  <p>VR：左スティックで移動、左右トリガーで旋回、Aで開始・ダッシュとグレネード・射撃、両トリガーでハイパーモード、Xでポーズ、Bでタイトルへ（ポーズ中）。</p>
  <p>移動：矢印 / WASD　開始・射撃：X / .　左旋回：Z / ,　右旋回：C / /　ポーズ：F1　タイトルへ：Esc</p>
  <p>射撃キーを押すとダッシュとグレネード、押し続けると射撃します。<br>黄色のアイテムを集め、Z＋Cでハイパーモード。敵の撃破で弾をアイテムに変え、得点倍率を上げられます。</p>
