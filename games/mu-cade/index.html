  <p>移動：矢印 / WASD　開始・ショット：Z / Ctrl（押している間は方向固定）　照準・ショット：IJKL<br>尾を切る：X / Shift / Space　ポーズ：P　タイトルへ：Esc</p>
  <p>敵を場外へ押し出して得点。尾が長いほど倍率が上がります。尾を切ると敵弾を消し、一定時間ショットが強くなります。自分が落ちるとミス。</p>
