<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABA Games · ゲームを選ぶ</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<main id="launcher">
  <section id="selection" aria-labelledby="selection-title">
    <h1 id="selection-title">ABA Games</h1>
    <p>13作品からゲームを選んでください</p>
    <nav id="game-list" class="game-selection" aria-label="ゲーム選択"></nav>
    <p>矢印キー / 左スティック / 十字キーで選択 · Enter / Aで開始</p>
    <p>各ゲームのポーズ・タイトル操作はそのままです。ゲーム一覧へ戻るには「ゲーム一覧へ」または Alt＋Esc</p>
    <p><a href="https://www.asahi-net.or.jp/~cs8k-cyu/">原作：Kenta Cho / ABA Games</a> · <a href="LICENSE.txt">ライセンス</a></p>
  </section>
  <section id="player" aria-labelledby="playing-title" hidden>
    <nav class="player-toolbar"><button id="return-to-list" type="button">← ゲーム一覧へ</button><strong id="playing-title"></strong><span>Alt＋Esc</span></nav>
    <p id="launch-status" role="status"></p>
    <div id="game-container"></div>
  </section>
  <noscript>ゲームを選ぶにはJavaScriptを有効にしてください</noscript>
</main>
<script type="module" src="selector.js"></script>
</html>
